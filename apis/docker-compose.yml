services:
  apis:
    build: .
    container_name: farm-ai-apis
    ports:
      - '3000:3000'
      - '3001:3001'
    environment:
      - PORT=3000
      - MS_HOST=0.0.0.0
      - MS_PORT=3001
      - DATABASE_URL=postgresql://farm_ai_user:password123@postgres:5432/farm_ai_db?schema=public
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: farm-ai-postgres
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: farm_ai_user
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: farm_ai_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
